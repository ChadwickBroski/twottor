<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <title>Create Account | Twottor</title>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="signup-title">
        <a class="login-brand" href="index.html" aria-label="Twottor home">
          <i class="fa-solid fa-feather"></i>
          <span>Twottor</span>
        </a>
        <div class="login-heading">
          <h1 id="signup-title">Create your account</h1>
          <p>Join the conversation on Twottor.</p>
        </div>
        <button class="google-login" type="button">
          <i class="fa-brands fa-google"></i>
          <span>Sign up with Google</span>
        </button>
        <div class="login-divider" aria-hidden="true"><span>or sign up with email</span></div>
        <form class="login-form" id="signup-form">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="Enter your username" required />
          <label for="handle">Handle name</label>
          <input type="text" id="handle" autocomplete="email" placeholder="Enter your handle name" required />
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="Create a password" minlength="6" required />
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" placeholder="Repeat your password" minlength="6" required />
          <button class="login-submit" type="submit">Create account</button>
          <p class="login-message" id="signup-message" role="status"></p>
        </form>
        <p class="signup-prompt">Already have an account? <a href="login.html">Log in</a></p>
      </section>
    </main>
    <script type="module" src="src/signup.js"></script>
  </body>
</html>
